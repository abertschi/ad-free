// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext.kotlin_version = '1.7.10'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.12.3'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"

        // REMOVED: classpath 'org.codehaus.groovy:groovy-android-gradle-plugin:1.2.0'
        // This plugin is deprecated and the artifact is missing from standard repositories.
        // Unless you have legacy Groovy code in your Android project, you do not need this.
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
        jcenter()
    }
}



task clean(type: Delete) {
    delete rootProject.buildDir
}
